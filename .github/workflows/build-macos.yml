name: Build macOS

on:
  workflow_dispatch:

  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  # Evita que Go descargue automáticamente un toolchain más nuevo
  # si alguna dependencia lo solicita.
  GOTOOLCHAIN: "local"

  NODE_VERSION: "22.20.0"

  WAILS_VERSION: "v2.12.0"

  LIBUSB_VERSION: "1.0.30"
  LIBUSB_SHA256: "fea36f34f9156400209595e300840767ab1a385ede1dc7ee893015aea9c6dbaf"

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}

    strategy:
      fail-fast: false

      matrix:
        include:
          # Apple Silicon: keep the proven modern build unchanged.
          - arch: arm64
            runner: macos-15
            platform: darwin/arm64
            artifact: epos-proxy-macos-arm64-macos11plus
            go_version: "1.24.13"
            go_mod_version: "1.24.0"
            deployment_target: "11.0"

          # Intel legacy: Catalina 10.15+.
          # Go 1.22.12 is the last Go release supported on Catalina.
          - arch: amd64
            runner: macos-15-intel
            platform: darwin/amd64
            artifact: epos-proxy-macos-intel-catalina10.15plus
            go_version: "1.22.12"
            go_mod_version: "1.22.0"
            deployment_target: "10.15"

    runs-on: ${{ matrix.runner }}

    env:
      GO_VERSION: ${{ matrix.go_version }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # GO
      # ============================================================

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # ============================================================
      # NODE
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ============================================================
      # BUILD TOOLS
      # ============================================================

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail

          brew install pkg-config

      # ============================================================
      # TARGET-SPECIFIC GO MODULE COMPATIBILITY
      #
      # ARM64 / macOS 11+ keeps Go 1.24.13.
      # Intel / Catalina uses Go 1.22.12, the last Go release supported
      # by macOS 10.15. The proxy server itself uses the standard library,
      # so no web-framework downgrade is required for the legacy target.
      # ============================================================

      - name: Configure Go dependencies for target
        shell: bash
        run: |
          set -euxo pipefail

          cat > go.mod <<'EOF'
          module epos-proxy

          go ${{ matrix.go_mod_version }}

          require (
              github.com/emersion/go-autostart v0.0.0-20250403115856-34830d6457d2
              github.com/google/gousb v1.1.3
              github.com/sirupsen/logrus v1.9.4
              github.com/wailsapp/wails/v2 v2.12.0
              github.com/yusufpapurcu/wmi v1.2.4
              golang.org/x/sys v0.30.0
              gopkg.in/natefinch/lumberjack.v2 v2.2.1
          )
          EOF

          rm -f go.sum

          go mod tidy

          echo
          echo "========================================"
          echo "Resolved go.mod"
          echo "========================================"

          cat go.mod

          echo
          echo "========================================"
          echo "Go version"
          echo "========================================"

          go version

      # ============================================================
      # WAILS
      # ============================================================

      - name: Install Wails
        shell: bash
        run: |
          set -euxo pipefail

          go install \
            github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # ============================================================
      # LIBUSB
      #
      # Compilamos libusb estáticamente.
      #
      # De esta forma el Mac del usuario NO necesita:
      #
      #   brew install libusb
      #
      # ni dependencias en:
      #
      #   /opt/homebrew
      #   /usr/local
      #
      # ============================================================

      - name: Build static libusb
        shell: bash
        run: |
          set -euxo pipefail

          PREFIX="${RUNNER_TEMP}/libusb-static"
          SRC="${RUNNER_TEMP}/libusb-src"
          ARCHIVE="${RUNNER_TEMP}/libusb.tar.bz2"

          mkdir -p "$SRC"

          curl \
            --fail \
            --location \
            --retry 3 \
            "https://github.com/libusb/libusb/releases/download/v${LIBUSB_VERSION}/libusb-${LIBUSB_VERSION}.tar.bz2" \
            --output "$ARCHIVE"

          echo "${LIBUSB_SHA256}  ${ARCHIVE}" \
            | shasum -a 256 -c -

          tar \
            -xjf "$ARCHIVE" \
            -C "$SRC" \
            --strip-components=1

          cd "$SRC"

          ./configure \
            --prefix="$PREFIX" \
            --enable-static \
            --disable-shared \
            CFLAGS="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}" \
            LDFLAGS="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}"

          make -j"$(sysctl -n hw.ncpu)"

          make install

          echo "PKG_CONFIG_PATH=${PREFIX}/lib/pkgconfig" \
            >> "$GITHUB_ENV"

          echo "CGO_ENABLED=1" \
            >> "$GITHUB_ENV"

          echo "CGO_CFLAGS=-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}" \
            >> "$GITHUB_ENV"

          # Security.framework soluciona:
          #
          # SecTaskCreateFromSelf
          # SecTaskCopyValueForEntitlement
          #
          echo "CGO_LDFLAGS=-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -framework IOKit -framework CoreFoundation -framework Security" \
            >> "$GITHUB_ENV"

      # ============================================================
      # ENVIRONMENT INFO
      # ============================================================

      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo
          echo "========================================"
          echo "Architecture"
          echo "========================================"

          uname -m

          echo
          echo "========================================"
          echo "macOS runner"
          echo "========================================"

          sw_vers

          echo
          echo "========================================"
          echo "Go"
          echo "========================================"

          go version

          echo
          echo "========================================"
          echo "Go toolchain policy"
          echo "========================================"

          go env GOTOOLCHAIN

          echo
          echo "========================================"
          echo "Node"
          echo "========================================"

          node --version

          echo
          echo "========================================"
          echo "npm"
          echo "========================================"

          npm --version

          echo
          echo "========================================"
          echo "Wails"
          echo "========================================"

          wails version

          echo
          echo "========================================"
          echo "libusb"
          echo "========================================"

          pkg-config --modversion libusb-1.0
          pkg-config --cflags --libs libusb-1.0

          echo
          echo "========================================"
          echo "Deployment target"
          echo "========================================"

          echo "$MACOSX_DEPLOYMENT_TARGET"

          echo
          echo "========================================"
          echo "CGO flags"
          echo "========================================"

          echo "$CGO_CFLAGS"
          echo "$CGO_LDFLAGS"

      # ============================================================
      # PREPARE EMBED DIRECTORY
      #
      # main.go contiene:
      #
      #   //go:embed all:frontend/dist
      #
      # Wails necesita poder cargar el paquete Go antes de haber
      # compilado todavía el frontend.
      #
      # Por eso frontend/dist debe existir inicialmente.
      # ============================================================

      - name: Prepare frontend embed directory
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p frontend/dist

          touch frontend/dist/.gitkeep

          echo "Initial frontend structure:"

          find frontend \
            -maxdepth 2 \
            -type f \
            -print \
            | sort

      # ============================================================
      # BUILD
      #
      # IMPORTANTE:
      #
      # NO ejecutamos npm run build manualmente.
      #
      # Wails debe generar primero:
      #
      #   frontend/wailsjs/go/models
      #   frontend/wailsjs/go/main/App
      #   frontend/wailsjs/runtime/runtime
      #
      # y después compilar el frontend TypeScript.
      # ============================================================

      - name: Build ePOS Proxy
        shell: bash
        run: |
          set -euxo pipefail

          wails build \
            --platform "${{ matrix.platform }}" \
            -clean \
            -trimpath \
            -o epos-proxy \
            -v 2

          echo
          echo "========================================"
          echo "Generated Wails bindings"
          echo "========================================"

          if [ -d frontend/wailsjs ]; then
            find frontend/wailsjs \
              -maxdepth 6 \
              -type f \
              -print \
              | sort
          else
            echo "WARNING: frontend/wailsjs not found"
          fi

          echo
          echo "========================================"
          echo "Generated frontend/dist"
          echo "========================================"

          if [ -d frontend/dist ]; then
            find frontend/dist \
              -maxdepth 4 \
              -type f \
              -print \
              | sort
          else
            echo "ERROR: frontend/dist does not exist"
            exit 1
          fi

          echo
          echo "========================================"
          echo "Build output"
          echo "========================================"

          find build/bin \
            -maxdepth 4 \
            -print \
            | sort

      # ============================================================
      # VERIFY WAILS BINDINGS
      # ============================================================

      - name: Verify generated Wails bindings
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -d frontend/wailsjs ]; then
            echo "ERROR: Wails bindings were not generated"
            exit 1
          fi

          echo "Wails bindings generated successfully."

      # ============================================================
      # GO TESTS
      #
      # Se ejecutan DESPUÉS del build porque main.go embebe
      # frontend/dist.
      # ============================================================

      - name: Run Go tests
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -d frontend/dist ]; then
            echo "ERROR: frontend/dist does not exist"
            exit 1
          fi

          go test -v ./...

      # ============================================================
      # LOCATE APPLICATION
      # ============================================================

      - name: Locate generated application
        shell: bash
        run: |
          set -euxo pipefail

          echo "Searching for generated .app..."

          find build/bin \
            -maxdepth 3 \
            -print \
            | sort

          APP_PATH="$(
            find build/bin \
              -maxdepth 1 \
              -type d \
              -name '*.app' \
              -print \
              -quit
          )"

          if [ -z "$APP_PATH" ]; then
            echo
            echo "ERROR:"
            echo "No macOS .app generated."
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" \
            >> "$GITHUB_ENV"

          echo
          echo "Application:"
          echo "$APP_PATH"

      # ============================================================
      # SET MINIMUM MACOS VERSION
      # ============================================================

      - name: Set minimum macOS version
        shell: bash
        run: |
          set -euxo pipefail

          PLIST="${APP_PATH}/Contents/Info.plist"

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist not found"
            exit 1
          fi

          if /usr/libexec/PlistBuddy \
              -c "Print :LSMinimumSystemVersion" \
              "$PLIST" \
              >/dev/null 2>&1
          then

            /usr/libexec/PlistBuddy \
              -c "Set :LSMinimumSystemVersion ${MACOSX_DEPLOYMENT_TARGET}" \
              "$PLIST"

          else

            /usr/libexec/PlistBuddy \
              -c "Add :LSMinimumSystemVersion string ${MACOSX_DEPLOYMENT_TARGET}" \
              "$PLIST"

          fi

          echo
          echo "LSMinimumSystemVersion:"

          /usr/libexec/PlistBuddy \
            -c "Print :LSMinimumSystemVersion" \
            "$PLIST"

      # ============================================================
      # VERIFY BUNDLE IDENTITY / LOCAL NETWORK METADATA
      # ============================================================

      - name: Verify macOS bundle identity and Local Network metadata
        shell: bash
        run: |
          set -euxo pipefail

          PLIST="${APP_PATH}/Contents/Info.plist"

          BUNDLE_ID="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$PLIST"
          )"

          echo "CFBundleIdentifier: $BUNDLE_ID"

          if [ "$BUNDLE_ID" != "com.wails.epos-proxy" ]; then
            echo "ERROR: unexpected CFBundleIdentifier: $BUNDLE_ID"
            exit 1
          fi

          if printf '%s' "$BUNDLE_ID" | grep -Eq '[^A-Za-z0-9.-]'; then
            echo "ERROR: CFBundleIdentifier contains invalid characters"
            exit 1
          fi

          LOCAL_NETWORK_USAGE="$(
            /usr/libexec/PlistBuddy \
              -c "Print :NSLocalNetworkUsageDescription" \
              "$PLIST"
          )"

          if [ -z "$LOCAL_NETWORK_USAGE" ]; then
            echo "ERROR: NSLocalNetworkUsageDescription is missing or empty"
            exit 1
          fi

          ALLOWS_LOCAL_NETWORKING="$(
            /usr/libexec/PlistBuddy \
              -c "Print :NSAppTransportSecurity:NSAllowsLocalNetworking" \
              "$PLIST"
          )"

          if [ "$ALLOWS_LOCAL_NETWORKING" != "true" ]; then
            echo "ERROR: NSAllowsLocalNetworking must be true"
            exit 1
          fi

          echo "macOS bundle identity and Local Network metadata verified."

      # ============================================================
      # LOCATE EXECUTABLE
      # ============================================================

      - name: Locate executable
        shell: bash
        run: |
          set -euxo pipefail

          EXECUTABLE="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleExecutable" \
              "${APP_PATH}/Contents/Info.plist"
          )"

          BIN="${APP_PATH}/Contents/MacOS/${EXECUTABLE}"

          if [ ! -f "$BIN" ]; then
            echo
            echo "ERROR: executable not found"
            echo "$BIN"
            exit 1
          fi

          echo "BIN=$BIN" \
            >> "$GITHUB_ENV"

          echo
          echo "Executable:"
          echo "$BIN"

          echo
          file "$BIN"

      # ============================================================
      # VERIFY ARCHITECTURE
      # ============================================================

      - name: Verify architecture
        shell: bash
        run: |
          set -euxo pipefail

          INFO="$(file "$BIN")"

          echo "$INFO"

          if [ "${{ matrix.arch }}" = "arm64" ]; then

            echo "$INFO" \
              | grep -q "arm64"

          elif [ "${{ matrix.arch }}" = "amd64" ]; then

            echo "$INFO" \
              | grep -q "x86_64"

          else

            echo "Unknown architecture:"
            echo "${{ matrix.arch }}"
            exit 1

          fi

          echo
          echo "Architecture verification successful."

      # ============================================================
      # VERIFY NO HOMEBREW / EXTERNAL LIBUSB
      # ============================================================

      - name: Verify dynamic dependencies
        shell: bash
        run: |
          set -euxo pipefail

          otool -L "$BIN" \
            | tee "${RUNNER_TEMP}/dependencies.txt"

          echo
          echo "Checking for external dependencies..."

          if grep -E \
            '(/opt/homebrew|/usr/local|libusb.*\.dylib)' \
            "${RUNNER_TEMP}/dependencies.txt"
          then

            echo
            echo "ERROR:"
            echo "External Homebrew/libusb dependency detected."

            exit 1

          fi

          echo
          echo "No external Homebrew/libusb dependencies detected."

      # ============================================================
      # VERIFY DEPLOYMENT TARGET
      # ============================================================

      - name: Verify macOS deployment target
        shell: bash
        run: |
          set -euxo pipefail

          echo
          echo "========================================"
          echo "vtool"
          echo "========================================"

          VTOOL_OUTPUT="$(vtool -show-build "$BIN")"
          printf '%s\n' "$VTOOL_OUTPUT"

          EXPECTED_MINOS_REGEX="$(
            printf '%s' "$MACOSX_DEPLOYMENT_TARGET" \
              | sed 's/\./\\./g'
          )"

          if ! printf '%s\n' "$VTOOL_OUTPUT" \
              | grep -Eq "minos[[:space:]]+${EXPECTED_MINOS_REGEX}([.]0)?([[:space:]]|$)"
          then
            echo
            echo "ERROR:"
            echo "Mach-O deployment target does not match ${MACOSX_DEPLOYMENT_TARGET}"
            exit 1
          fi

          echo
          echo "========================================"
          echo "Mach-O load commands"
          echo "========================================"

          otool -l "$BIN" \
            | grep -A 10 -E \
              'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' \
            || true

          echo
          echo "Deployment target verification successful."

      # ============================================================
      # AD-HOC SIGN
      #
      # Esto NO es Developer ID / notarización.
      #
      # Sirve para que el bundle tenga una firma coherente mientras
      # probamos que realmente funciona.
      # ============================================================

      - name: Ad-hoc sign application
        shell: bash
        run: |
          set -euxo pipefail

          codesign \
            --force \
            --deep \
            --sign - \
            "$APP_PATH"

          echo
          echo "Verifying signature..."

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP_PATH"

          echo
          echo "Signature information:"

          codesign \
            -dv \
            --verbose=4 \
            "$APP_PATH" \
            2>&1 \
            || true

      # ============================================================
      # PACKAGE
      #
      # ditto mantiene correctamente atributos y estructura .app.
      # ============================================================

      - name: Package application
        shell: bash
        run: |
          set -euxo pipefail

          ZIP="${{ matrix.artifact }}.zip"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            "$ZIP"

          shasum -a 256 "$ZIP" \
            > "${ZIP}.sha256"

          echo
          echo "========================================"
          echo "Generated artifacts"
          echo "========================================"

          ls -lh \
            "$ZIP" \
            "${ZIP}.sha256"

          echo
          echo "SHA256:"

          cat "${ZIP}.sha256"

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}

          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256

          if-no-files-found: error

          retention-days: 30

  # ==============================================================
  # RELEASE
  #
  # Si ejecutas manualmente workflow_dispatch:
  #
  #   Actions → Artifacts
  #
  # Si haces push de un tag:
  #
  #   GitHub Release
  #
  # ==============================================================

  release:
    name: Publish GitHub Release

    if: startsWith(github.ref, 'refs/tags/')

    needs:
      - build-macos

    runs-on: ubuntu-latest

    steps:
      - name: Download macOS builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show release contents
        shell: bash
        run: |
          set -euxo pipefail

          echo
          echo "Release files:"

          find dist \
            -maxdepth 2 \
            -type f \
            -print \
            | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256

          generate_release_notes: true
