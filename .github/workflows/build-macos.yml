name: Build macOS 11+

on:
  workflow_dispatch:

  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  # Go 1.24 es la última rama compatible con macOS 11 Big Sur
  GO_VERSION: "1.24.13"

  NODE_VERSION: "22"

  WAILS_VERSION: "v2.12.0"

  MACOSX_DEPLOYMENT_TARGET: "11.0"

  LIBUSB_VERSION: "1.0.30"
  LIBUSB_SHA256: "fea36f34f9156400209595e300840767ab1a385ede1dc7ee893015aea9c6dbaf"

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - arch: arm64
            runner: macos-15
            platform: darwin/arm64
            artifact: epos-proxy-macos-arm64-macos11plus

          - arch: amd64
            runner: macos-15-intel
            platform: darwin/amd64
            artifact: epos-proxy-macos-intel-macos11plus

    runs-on: ${{ matrix.runner }}

    steps:
      # ============================================================
      # SOURCE
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # TOOLCHAINS
      # ============================================================

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install build tools
        run: |
          brew install pkg-config

      # ============================================================
      # MACOS 11 COMPATIBILITY
      #
      # Current upstream:
      #
      #   go 1.25
      #   Fiber 3.4
      #   x/sys 0.47
      #
      # cannot produce a Go application supported on macOS 11.
      #
      # For this compatibility build we construct a compatible
      # go.mod using the same application source.
      # ============================================================

      - name: Configure Go dependencies for macOS 11
        shell: bash
        run: |
          set -euxo pipefail

          cat > go.mod <<'EOF'
          module epos-proxy

          go 1.24.0

          require (
              github.com/emersion/go-autostart v0.0.0-20250403115856-34830d6457d2
              github.com/gofiber/fiber/v3 v3.0.0-beta.4
              github.com/google/gousb v1.1.3
              github.com/sirupsen/logrus v1.9.4
              github.com/wailsapp/wails/v2 v2.12.0
              github.com/yusufpapurcu/wmi v1.2.4
              golang.org/x/sys v0.30.0
              gopkg.in/natefinch/lumberjack.v2 v2.2.1
          )
          EOF

          rm -f go.sum

          go mod tidy

          echo
          echo "=============================="
          echo "Resolved Go module:"
          echo "=============================="
          cat go.mod

          echo
          echo "=============================="
          echo "Go version:"
          echo "=============================="
          go version

      # ============================================================
      # WAILS
      # ============================================================

      - name: Install Wails
        shell: bash
        run: |
          set -euxo pipefail

          go install \
            github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # ============================================================
      # LIBUSB
      #
      # Build statically so target Mac does NOT need:
      #
      #   brew install libusb
      #
      # ============================================================

      - name: Build static libusb
        shell: bash
        run: |
          set -euxo pipefail

          PREFIX="${RUNNER_TEMP}/libusb-static"
          SRC="${RUNNER_TEMP}/libusb-src"
          ARCHIVE="${RUNNER_TEMP}/libusb.tar.bz2"

          mkdir -p "$SRC"

          curl \
            --fail \
            --location \
            --retry 3 \
            "https://github.com/libusb/libusb/releases/download/v${LIBUSB_VERSION}/libusb-${LIBUSB_VERSION}.tar.bz2" \
            --output "$ARCHIVE"

          echo "${LIBUSB_SHA256}  ${ARCHIVE}" \
            | shasum -a 256 -c -

          tar \
            -xjf "$ARCHIVE" \
            -C "$SRC" \
            --strip-components=1

          cd "$SRC"

          ./configure \
            --prefix="$PREFIX" \
            --enable-static \
            --disable-shared \
            CFLAGS="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}" \
            LDFLAGS="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}"

          make -j"$(sysctl -n hw.ncpu)"

          make install

          echo "PKG_CONFIG_PATH=${PREFIX}/lib/pkgconfig" >> "$GITHUB_ENV"

          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"

          echo "CGO_CFLAGS=-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}" \
            >> "$GITHUB_ENV"

          # Security.framework es necesario para:
          #
          # SecTaskCreateFromSelf
          # SecTaskCopyValueForEntitlement
          #
          echo "CGO_LDFLAGS=-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -framework IOKit -framework CoreFoundation -framework Security" \
            >> "$GITHUB_ENV"

      # ============================================================
      # FRONTEND
      #
      # main.go contiene:
      #
      # //go:embed all:frontend/dist
      #
      # Por eso frontend/dist DEBE existir antes de ejecutar
      # go test.
      # ============================================================

      - name: Build frontend
        shell: bash
        run: |
          set -euxo pipefail

          cd frontend

          npm install

          npm run build

          cd ..

          if [ ! -d frontend/dist ]; then
            echo "ERROR: frontend/dist was not generated"
            exit 1
          fi

          echo
          echo "Frontend generated successfully:"
          find frontend/dist -maxdepth 2 -type f -print

      # ============================================================
      # DIAGNOSTICS
      # ============================================================

      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "Architecture:"
          uname -m

          echo
          echo "macOS runner:"
          sw_vers

          echo
          echo "Go:"
          go version

          echo
          echo "Node:"
          node --version

          echo
          echo "npm:"
          npm --version

          echo
          echo "Wails:"
          wails version

          echo
          echo "libusb:"
          pkg-config --modversion libusb-1.0

          echo
          echo "libusb flags:"
          pkg-config --cflags --libs libusb-1.0

          echo
          echo "Deployment target:"
          echo "$MACOSX_DEPLOYMENT_TARGET"

          echo
          echo "CGO flags:"
          echo "$CGO_CFLAGS"
          echo "$CGO_LDFLAGS"

      # ============================================================
      # TESTS
      # ============================================================

      - name: Run Go tests
        shell: bash
        run: |
          set -euxo pipefail

          go test -v ./...

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build ePOS Proxy
        shell: bash
        run: |
          set -euxo pipefail

          wails build \
            --platform "${{ matrix.platform }}" \
            -clean \
            -trimpath \
            -o epos-proxy

      # ============================================================
      # FIND GENERATED APP
      # ============================================================

      - name: Locate generated application
        shell: bash
        run: |
          set -euxo pipefail

          echo "Contents of build/bin:"
          find build/bin -maxdepth 3 -print

          APP_PATH="$(
            find build/bin \
              -maxdepth 1 \
              -type d \
              -name '*.app' \
              -print \
              -quit
          )"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: no macOS .app generated"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo
          echo "Generated application:"
          echo "$APP_PATH"

      # ============================================================
      # MINIMUM MACOS
      # ============================================================

      - name: Set minimum macOS version
        shell: bash
        run: |
          set -euxo pipefail

          PLIST="${APP_PATH}/Contents/Info.plist"

          if /usr/libexec/PlistBuddy \
              -c "Print :LSMinimumSystemVersion" \
              "$PLIST" >/dev/null 2>&1
          then

            /usr/libexec/PlistBuddy \
              -c "Set :LSMinimumSystemVersion ${MACOSX_DEPLOYMENT_TARGET}" \
              "$PLIST"

          else

            /usr/libexec/PlistBuddy \
              -c "Add :LSMinimumSystemVersion string ${MACOSX_DEPLOYMENT_TARGET}" \
              "$PLIST"

          fi

          echo
          echo "LSMinimumSystemVersion:"

          /usr/libexec/PlistBuddy \
            -c "Print :LSMinimumSystemVersion" \
            "$PLIST"

      # ============================================================
      # LOCATE BINARY
      # ============================================================

      - name: Locate executable
        shell: bash
        run: |
          set -euxo pipefail

          EXECUTABLE="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleExecutable" \
              "${APP_PATH}/Contents/Info.plist"
          )"

          BIN="${APP_PATH}/Contents/MacOS/${EXECUTABLE}"

          if [ ! -f "$BIN" ]; then
            echo "ERROR: executable not found:"
            echo "$BIN"
            exit 1
          fi

          echo "BIN=$BIN" >> "$GITHUB_ENV"

          echo
          file "$BIN"

      # ============================================================
      # VERIFY ARCHITECTURE
      # ============================================================

      - name: Verify architecture
        shell: bash
        run: |
          set -euxo pipefail

          INFO="$(file "$BIN")"

          echo "$INFO"

          if [ "${{ matrix.arch }}" = "arm64" ]; then
            echo "$INFO" | grep -q "arm64"
          else
            echo "$INFO" | grep -q "x86_64"
          fi

      # ============================================================
      # VERIFY NO HOMEBREW DEPENDENCIES
      # ============================================================

      - name: Verify dynamic dependencies
        shell: bash
        run: |
          set -euxo pipefail

          otool -L "$BIN" \
            | tee "${RUNNER_TEMP}/dependencies.txt"

          if grep -E \
            '(/opt/homebrew|/usr/local|libusb.*\.dylib)' \
            "${RUNNER_TEMP}/dependencies.txt"
          then

            echo
            echo "ERROR:"
            echo "External Homebrew/libusb dependency detected."

            exit 1
          fi

          echo
          echo "No external libusb dependency detected."

      # ============================================================
      # VERIFY MACOS 11 DEPLOYMENT TARGET
      # ============================================================

      - name: Verify deployment target
        shell: bash
        run: |
          set -euxo pipefail

          echo "Mach-O build information:"
          vtool -show-build "$BIN" || true

          echo
          echo "Load commands:"

          otool -l "$BIN" \
            | grep -A 8 -E \
              'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' \
            || true

      # ============================================================
      # AD-HOC SIGN
      #
      # No Apple Developer certificate required for testing.
      # ============================================================

      - name: Ad-hoc sign application
        shell: bash
        run: |
          set -euxo pipefail

          codesign \
            --force \
            --deep \
            --sign - \
            "$APP_PATH"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP_PATH"

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package application
        shell: bash
        run: |
          set -euxo pipefail

          ZIP="${{ matrix.artifact }}.zip"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            "$ZIP"

          shasum -a 256 "$ZIP" \
            > "${ZIP}.sha256"

          echo
          echo "Generated artifacts:"

          ls -lh \
            "$ZIP" \
            "${ZIP}.sha256"

          echo
          cat "${ZIP}.sha256"

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}

          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256

          if-no-files-found: error

  # ==============================================================
  # GITHUB RELEASE
  # ==============================================================

  release:
    name: Publish GitHub Release

    if: startsWith(github.ref, 'refs/tags/')

    needs:
      - build-macos

    runs-on: ubuntu-latest

    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show release contents
        run: |
          find dist -maxdepth 2 -type f -print

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256

          generate_release_notes: true
