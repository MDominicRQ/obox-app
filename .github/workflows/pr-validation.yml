name: PR Validation

on:
  pull_request:
    branches:
      - main

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: 'epos-proxy-linux64'
            platform: 'linux/amd64'
            os: 'ubuntu-latest'

          - name: 'epos-proxy-win64'
            platform: 'windows/amd64'
            os: 'windows-latest'

    runs-on: ${{ matrix.build.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          submodules: recursive

      - name: Build wails
        uses: ./.github/actions
        with:
          build-name: ${{ matrix.build.name }}
          build-platform: ${{ matrix.build.platform }}
          package: false
          go-version: '1.26.0'
          node-version: '22.20.0'
          wails-version: 'v2.12.0'

      - name: Generate reproducible dependency snapshots
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          go mod tidy
          cd frontend
          npm install --package-lock-only --ignore-scripts

      - name: Upload dependency snapshots
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-snapshots
          path: |
            go.mod
            go.sum
            frontend/package-lock.json
          if-no-files-found: error

      - name: Commit dependency locks to PR branch
        if: runner.os == 'Linux' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euxo pipefail

          if git diff --quiet -- go.mod go.sum frontend/package-lock.json              && git ls-files --error-unmatch frontend/package-lock.json >/dev/null 2>&1
          then
            echo "Dependency locks already match."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add go.mod go.sum
          git add -f frontend/package-lock.json
          git commit -m "Lock application dependencies"
          git push origin "HEAD:${HEAD_BRANCH}"
